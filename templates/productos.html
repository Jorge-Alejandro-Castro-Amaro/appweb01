{% extends "layout.html" %} {% block content %}

<div class="container-fluid">
  <h1>Productos</h1>
  <p>Bienvenido a la página de contacto de UDL-ICO!</p>
  <p>Aquí puedes encontrar información sobre nuestros productos.</p>
</div>

<div
  id="carouselExampleControls"
  class="carousel slide product-carousel"
  data-ride="carousel"
>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="{{ url_for('static', filename='img/productos/dulce.jpeg') }}"
        class="d-block w-100 carousel-product-image"
        alt="Dulce"
      />
    </div>
    <div class="carousel-item">
      <img
        src="{{ url_for('static', filename='img/productos/pan.png') }}"
        class="d-block w-100 carousel-product-image"
        alt="Pan"
      />
    </div>
    <div class="carousel-item">
      <img
        src="{{ url_for('static', filename='img/productos/papel.png') }}"
        class="d-block w-100 carousel-product-image"
        alt="Papel"
      />
    </div>
  </div>
  <button
    class="carousel-control-prev"
    type="button"
    data-target="#carouselExampleControls"
    data-slide="prev"
    aria-label="Producto anterior"
  >
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </button>
  <button
    class="carousel-control-next"
    type="button"
    data-target="#carouselExampleControls"
    data-slide="next"
    aria-label="Producto siguiente"
  >
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </button>
</div>

{% endblock %}
